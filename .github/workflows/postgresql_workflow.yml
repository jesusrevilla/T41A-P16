name: PostgreSQL Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install python3-pip python3-psycopg2 -y
        pip install pytest

    - name: Set Postgres password
      run: echo "PGPASSWORD=postgres" >> $GITHUB_ENV

    - name: Run SQL setup
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -f 01_create_tables.sql
        psql -h localhost -U postgres -f 02_create_procedure.sql
        psql -h localhost -U postgres -f 03_create_function.sql
        psql -h localhost -U postgres -f 04_create_trigger.sql
        psql -h localhost -U postgres -f 05_insert_data.sql

    - name: Run Tests
      env:
        PGPASSWORD: postgres
      run: pytest -q

